name: Hub migration 0022 (one-off)
# Adds echo, lasso and fuse to the playtest hub's production D1 and records the migration in
# d1_migrations, the same as applying it by hand. Safe to re-run: it stops if 0022 is already recorded.
on:
  workflow_dispatch:
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/hub
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      W: npx -y wrangler@4
    steps:
      - uses: actions/checkout@v6
      - name: Show recorded migrations
        run: $W d1 execute playtest --remote --command "SELECT id, name, applied_at FROM d1_migrations ORDER BY id"
      - name: Apply 0022 if it isn't recorded yet
        run: |
          if $W d1 execute playtest --remote --json --command "SELECT name FROM d1_migrations WHERE name = '0022_prototypes.sql'" | grep -q 0022_prototypes; then
            echo "0022_prototypes.sql is already recorded; nothing to do."
            exit 0
          fi
          $W d1 execute playtest --remote --yes --file 0022_prototypes.sql
          $W d1 execute playtest --remote --yes --command "INSERT INTO d1_migrations (name) VALUES ('0022_prototypes.sql')"
      - name: Show the new games
        run: $W d1 execute playtest --remote --command "SELECT id, name, status, visibility, app_origin FROM games WHERE id IN ('echo', 'lasso', 'fuse')"
